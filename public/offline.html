<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0d9488">
    <title>TheBoise: no connection</title>
    <style>
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box;
               font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f1f5f9; color: #0f172a; text-align: center; }
        .card { max-width: 340px; background: #fff; border-radius: 24px; padding: 32px 24px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
        img { width: 64px; height: 64px; border-radius: 16px; }
        h1 { font-size: 22px; margin: 16px 0 8px; }
        p { color: #475569; line-height: 1.5; margin: 0 0 20px; }
        button { border: 0; border-radius: 12px; background: #ef3b2d; color: #fff; font-weight: 700; font-size: 15px; padding: 12px 22px; }
        @media (prefers-color-scheme: dark) { body { background: #020617; color: #e2e8f0; } .card { background: #0f172a; } p { color: #94a3b8; } }
    </style>
</head>
<body>
    <div class="card">
        <img src="/icons/icon-192.png" alt="">
        <h1>No connection</h1>
        <p>TheBoise needs the internet to show your albums. Check your connection and try again.</p>
        <button onclick="location.reload()">Try again</button>
    </div>
</body>
</html>
